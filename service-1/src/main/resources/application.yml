server:
  port: 8080

spring:
  application:
    name: service-1
  datasource:
    url: jdbc:h2:file:/data/trade_platform;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: service-1-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml

app:
  jwt:
    # Shared HS256 secret with the NestJS BFF. NEVER hardcode in production.
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
  topics:
    order-placed: ${KAFKA_TOPIC_ORDER_PLACED:order-placed}
    trade-events: ${KAFKA_TOPIC_TRADE_EVENTS:trade-events}
    market-data: ${KAFKA_TOPIC_MARKET_DATA:market-data}
  onboarding:
    default-cash: 1000000
    watchlist-symbols: NVDA,AAPL,MSFT,TSLA,META,GOOG,AMZN
  service2:
    base-url: ${SERVICE2_URL:http://localhost:8082}
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:2000}
  h2:
    tcp:
      enabled: ${H2_TCP_ENABLED:false}
      port: ${H2_TCP_PORT:9095}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "[%d{yyyy-MM-dd HH:mm:ss.SSS}] [%thread] %-5level %logger{36} - %msg%n"
  level:
    com.trade.platform: INFO
    org.mybatis: WARN