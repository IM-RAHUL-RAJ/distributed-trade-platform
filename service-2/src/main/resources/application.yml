server:
  port: 8080

spring:
  application:
    name: service-2
  datasource:
    # Service 2 owns its own embedded H2 file DB (execution state: orders,
    # accounts/cash, positions, trades, transactions, market_data, acks).
    url: jdbc:h2:file:/data/s2_trade_platform;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: service-2-executor
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml

app:
  topics:
    order-placed: ${KAFKA_TOPIC_ORDER_PLACED:order-placed}
    trade-events: ${KAFKA_TOPIC_TRADE_EVENTS:trade-events}
    market-data: ${KAFKA_TOPIC_MARKET_DATA:market-data}
  funksance:
    api-url: ${FUNKSANCE_API_URL:http://localhost:8080}
    poll-interval-ms: ${MARKET_DATA_POLL_INTERVAL_MS:5000}
  h2:
    tcp:
      enabled: ${H2_TCP_ENABLED:false}
      port: ${H2_TCP_PORT:9096}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "[%d{yyyy-MM-dd HH:mm:ss.SSS}] [%thread] %-5level %logger{36} - %msg%n"
  level:
    com.trade.platform.s2: INFO
    org.mybatis: WARN
    org.apache.kafka.clients.consumer: WARN